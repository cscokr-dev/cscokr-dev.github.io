<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mine Gallery — Test Build</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1016; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; color: #c9cbd6; }
  #stage { position: relative; height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; background: #181a23; }
  @media (max-aspect-ratio: 9/16) { #stage { width: 100vw; height: 100dvh; aspect-ratio: auto; } }
  #unity-canvas { width: 100%; height: 100%; display: block; outline: none; -webkit-tap-highlight-color: transparent; }
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: none; }
  #bar { width: 56%; height: 6px; border-radius: 3px; background: #2a2d3a; overflow: hidden; }
  #fill { width: 0; height: 100%; background: #f2b84b; transition: width .15s linear; }
  #note { font-size: 13px; opacity: .75; text-align: center; padding: 0 24px; }
  #tag { position: fixed; left: 8px; bottom: 6px; font-size: 11px; opacity: .45; pointer-events: none; }
  @media (max-aspect-ratio: 1/1) { #tag { display: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div>Mine Gallery</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="note">Loading…</div>
  </div>
</div>
<div id="tag">Test build 2026-11-13 08:21 · placeholder art · mock ads</div>
<script src="Build/WebGL.loader.js"></script>
<script>
  var canvas = document.getElementById("unity-canvas");
  var note = document.getElementById("note");
  createUnityInstance(canvas, {
    dataUrl: "Build/WebGL.data.unityweb",
    frameworkUrl: "Build/WebGL.framework.js.unityweb",
    codeUrl: "Build/WebGL.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "MINE Studio",
    productName: "Mine Gallery",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  }, function (progress) {
    document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
  }).then(function () {
    document.getElementById("loading").style.display = "none";
    canvas.focus();
  }).catch(function (message) {
    note.textContent = "Failed to start: " + message;
  });
</script>
</body>
</html>
